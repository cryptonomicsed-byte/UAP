name: Foundation verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install the native runtimes used by the test suite
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-browser-evidence
          path: tests/out/foundation/
          if-no-files-found: ignore
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_PASSWORD: uap-ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          TEST_POSTGRES_ADMIN_URL: postgres://postgres:uap-ci-fixture-only@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-storage-evidence
          path: tests/out/postgres/
          if-no-files-found: ignore
  rights:
    # V6-01-07: SBOM + license policy + asset/font rights manifest are a release gate,
    # not a wiki page. Fails closed on unknown licenses, unregistered assets or an
    # unreadable lockfile; the SBOM it uploads is bound to the lockfile hash.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rights audit (SBOM + licenses + assets)
        run: npm run audit:rights
      - name: Rights audit self-tests (negative paths incl. GPL refusal)
        run: node --import tsx --test tests/rights-audit.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rights-sbom-evidence
          path: artifacts/rights/
          if-no-files-found: error
  rust:
    # V6-05 / track E: the policy kernel is the permission authority, so it is its own
    # release gate. fmt + clippy -D warnings + the full contract suite, in debug and in
    # release (the release profile enables overflow-checks on purpose: a policy kernel
    # that silently wraps u64 spend arithmetic is a bug, not a performance win).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
  policy-portability:
    # V6-05-09: the lease contract must verify identically in Rust, Elixir, Go and
    # Python. A missing toolchain fails here (REQUIRE_ALL=1) instead of being skipped:
    # a portability claim tested in one language is not a portability claim.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - run: python3 -m pip install --quiet 'cryptography>=42'
      - name: Verify every golden fixture in four languages
        run: REQUIRE_ALL=1 bash scripts/portable-lease-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-lease-evidence
          path: artifacts/portable-lease/
          if-no-files-found: warn
  elixir-worker:
    # Track F / M2-08: the Elixir worker owns ephemeral task lifecycle (architecture
    # freeze authority #2). Gate: formatted, warnings-as-errors compile, ExUnit
    # including the negative paths (duplicate key refused, dead pid not "success",
    # status reports :down instead of a fake zero).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - name: Fetch dependencies
        working-directory: elixir/agentos_worker
        run: mix deps.get
      - name: Mix check (format + warnings-as-errors + tests)
        working-directory: elixir/agentos_worker
        run: mix check
  elixir-staging:
    # Track F / M2-12: the durable queue must hold at 1/10/100 concurrent worker
    # processes against real PostgreSQL — every job claimed and settled exactly
    # once, fenced repeats refused, one run + claimed/succeeded event per job.
    # The drill writes tests/out/elixir/staging-concurrency.json as evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_PASSWORD: uap-ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOOTSTRAP_URL: postgres://postgres:uap-ci-fixture-only@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:uap-ci-fixture-only@127.0.0.1:5432/uap_staging
      TEST_WORKER_DATABASE_URL: postgres://uap_staging_worker:uap-ci-worker-only@127.0.0.1:5432/uap_staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - run: npm ci
      - name: Provision staging database and worker login
        run: |
          psql "$BOOTSTRAP_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE uap_staging_worker LOGIN NOINHERIT PASSWORD 'uap-ci-worker-only'" \
            -c "CREATE DATABASE uap_staging OWNER postgres"
          UAP_POSTGRES_ADMIN_URL="$TEST_DATABASE_URL" npm run -s db:postgres -- migrate >/dev/null
          UAP_POSTGRES_ADMIN_URL="$TEST_DATABASE_URL" npm run -s db:postgres -- grant-job-worker --role uap_staging_worker >/dev/null
      - name: 1/10/100 concurrency drill
        working-directory: elixir/agentos_worker
        run: |
          mix deps.get
          mix test --only staging --include staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elixir-staging-evidence
          path: tests/out/elixir/
          if-no-files-found: warn
