[package]
name = "agentos-policy"
description = "Authoritative typed policy kernel: ActionIntent, ResourceScope, Grant, Budget, Lease, dispatch validation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "verify-lease"
path = "src/bin/verify_lease.rs"

[[bin]]
name = "authorize"
path = "src/bin/authorize.rs"

[[bin]]
name = "mint"
path = "src/bin/mint.rs"

[[bin]]
name = "mint-fixtures"
path = "src/bin/mint_fixtures.rs"
required-features = []

[dependencies]
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
